services:
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      DATA_DIR: /data
      GENERATOR_MODE: ${GENERATOR_MODE:-auto}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-6.2-sol}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2.5-sunburst}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      SEEDREAM_BASE_URL: ${SEEDREAM_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      SEEDREAM_MODEL: ${SEEDREAM_MODEL:-doubao-seedream-5-5-261028}
      SEEDREAM_API_KEY: ${SEEDREAM_API_KEY:-}
      SEEDREAM_SIZE: ${SEEDREAM_SIZE:-2K}
      ARCHIVE_RETENTION_MONTHS: "3"
    volumes:
      - world-data:/data
    restart: unless-stopped
volumes:
  world-data:
